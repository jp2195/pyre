version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    # Default linters
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional linters
    - misspell
    - unconvert
    - gosec
    - prealloc

  settings:
    errcheck:
      # check-type-assertions catches missing comma-ok on .(T) assertions.
      # check-blank is intentionally off so `_ = foo()` is accepted as an
      # explicit intent-to-discard — the Go-community standard.
      check-type-assertions: true
      check-blank: false

    govet:
      enable-all: true
      disable:
        - fieldalignment

    gosec:
      excludes:
        - G104 # Audit errors not checked (handled by errcheck)
        - G304 # File path provided as taint input (intentional for config files)

    misspell:
      ignore-rules:
        - licence
        - colour

  exclusions:
    rules:
      # Tests routinely ignore cleanup errors (deferred Close, etc.)
      - path: _test\.go
        linters:
          - errcheck

      # Allow unused parameters in test files
      - path: _test\.go
        text: "unused-parameter"

      # Hardcoded credentials in test fixtures are not real secrets.
      - path: _test\.go
        text: "G101"

      # Test fixtures can echo query params back; not a real XSS surface.
      - path: _test\.go
        text: "G705"

      # Test-only mock server doesn't need MaxBytesReader around ParseForm.
      - path: internal/testutil/
        text: "G120"

issues:
  max-issues-per-linter: 50
  max-same-issues: 10

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/jp2195/pyre
